name: CI

# Asosiy CI.
#
#   backend         — Linux/PostgreSQL 16: pytest + coverage darvozasi + ruff +
#                     OpenAPI sxema ratchet'i. Prod shakli.
#   backend-sqlite  — Windows/SQLite: dasturchining kundalik muhiti. `position`
#                     satrlarining taqqoslanishi (collation) va `icontains`
#                     semantikasi ikki backend'da bir xil emas — shuning uchun
#                     ikkalasi ham tekshiriladi.
#   frontend        — eslint + tsc + vitest + vite build
#   e2e             — Playwright HAQIQIY stack ustida (Postgres + Redis +
#                     Daphne + `vite preview`). Ilgari bu umuman ishlamas edi:
#                     23 ta test faqat odam uchta jarayonni qo'lda ko'targanda
#                     tekshirilardi.
#   docker          — ikkala Dockerfile ham hali quriladimi
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ---------------------------------------------------------------- ratchet
  # Bu yerda BITTA son bor va u XATO BUDJETI: o'lchangan, taxmin qilinmagan,
  # va faqat PASAYADI. Ko'tarish — darvozani o'chirish bilan barobar, chunki
  # budjet aynan "backlog o'smasin" uchun turibdi.
  #
  # (Coverage poli boshqa yo'nalishda ishlaydi — u faqat KO'TARILADI — va
  # ataylab bu yerda emas, `backend/.coveragerc` dagi `fail_under` da
  # (2026-08-10 da o'lchangan 83.04% → 83). Bitta manba bo'lgani uchun lokal
  # `pytest --cov` va CI bir xil darvozani qo'llaydi.)
  #
  # drf-spectacular: 2026-08-10 da 54 ta noyob xato ("unable to guess
  # serializer" — `serializer_class` siz APIView'lar). `--fail-on-warn` ni
  # hozir yoqib bo'lmaydi, lekin backlog o'sishi ham mumkin emas.
  # 2026-08-11: qiymat 54 edi, lekin o'sha paytda
  # haqiqiy son 60 ga chiqib ketgan edi (ya'ni darvoza jimgina yiqilib
  # turardi). Status modeli refaktoringi ikkita status-set view'ini olib
  # tashladi va yangi endpointlar (§19 bildirishnomalar, user-search)
  # `@extend_schema` bilan annotatsiya qilindi — shuning uchun ular NOLGA
  # qo'shadi. Haqiqiy son: 58. Yangi APIView qo'shsangiz annotatsiya bering,
  # bu raqamni ko'tarmang.
  SCHEMA_UNIQUE_ERROR_BUDGET: "58"

  # mypy: 2026-08-11 da o'lchangan. `apps/core` QAT'IY va 0 xato (alohida
  # qadam), qolgan daraxt esa shu budjet ostida. Boshlang'ich 117 edi;
  # `apps/core` tozalangach 46 ga tushdi. Yangi kodga tip yozing — bu
  # raqamni ko'tarish darvozani o'chirish bilan barobar.
  MYPY_ERROR_BUDGET: "46"

jobs:
  # ==========================================================================
  # Backend — prod shakli (Linux + PostgreSQL 16)
  # ==========================================================================
  backend:
    name: Backend (Linux · PostgreSQL 16 · py3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          # CI-only dummy kredensiallar — prod bilan hech qanday aloqasi yo'q.
          POSTGRES_USER: clickup
          POSTGRES_PASSWORD: clickup
          POSTGRES_DB: clickup_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clickup -d clickup_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    # backend/.env.example bilan sinxron. Qiymatlar faqat CI uchun.
    env:
      DEBUG: "False"
      SECRET_KEY: "ci-dummy-not-a-real-secret-3f8a1c9e4b7d2056-padded-to-fifty-plus"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_URL: "postgres://clickup:clickup@localhost:5432/clickup_ci"
      REDIS_URL: "redis://localhost:6379/0"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      ACCESS_TOKEN_LIFETIME_MINUTES: "60"
      REFRESH_TOKEN_LIFETIME_DAYS: "7"
      INVITATION_TTL_DAYS: "7"
      AUTH_THROTTLE_RATE: "60/min"
      AUTH_BURST_THROTTLE_RATE: "60/min"
      COMMENT_THROTTLE_RATE: "120/min"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.14 o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Bog'liqliklarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Django check
        working-directory: backend
        run: python manage.py check

      - name: Migratsiya drift gate (makemigrations --check)
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Migratsiyalar
        working-directory: backend
        run: python manage.py migrate --noinput

      # ------------------------------------------------------------- lint
      # BLOKLOVCHI. Ilgari uchta qadam ham `continue-on-error: true` edi —
      # shu jumladan `pip install ruff` ning O'ZI, ya'ni o'rnatish yiqilsa
      # `ruff check` "command not found" bilan YASHIL bo'lardi. Endi ruff
      # `backend/requirements.txt` da, qoidalar `backend/ruff.toml` da va
      # to'plam bugungi daraxtda toza — qizil lint har doim "shu PR nimadir
      # buzdi" degani.
      - name: ruff check (bloklovchi)
        working-directory: backend
        run: ruff check --output-format=github .

      # ------------------------------------------------------------- mypy
      # Reja §10: "Typecheck: mypy (backend, bosqichma-bosqich)". Ikki qadam,
      # chunki bitta son butun daraxtni bir xil qattiqlikda ushlab turolmaydi.
      #
      # `--follow-imports=silent` MAJBURIY: usiz `apps/core` tekshiruvi begona
      # modullarning xatolarini ham sanaydi va qat'iy darvoza boshqa faylning
      # holatiga bog'lanib qoladi.
      - name: mypy — apps/core qat'iy (0 xato)
        working-directory: backend
        run: python -m mypy --follow-imports=silent apps/core

      - name: mypy — butun backend (ratchet)
        working-directory: backend
        run: |
          set -o pipefail
          python -m mypy > mypy.log 2>&1 || true
          python - <<'PY'
          import os, re, sys, pathlib

          log = pathlib.Path("mypy.log").read_text(encoding="utf-8", errors="replace")
          match = re.search("Found ([0-9]+) errors? in", log)
          found = int(match.group(1)) if match else 0   # "Success: no issues" -> 0
          budget = int(os.environ["MYPY_ERROR_BUDGET"])

          NL = chr(10)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("## mypy" + NL + NL)
              fh.write("Xatolar: **%d** / budjet %d" % (found, budget) + NL + NL)
              fh.write("```" + NL)
              fh.write(NL.join(log.strip().splitlines()[-5:]) + NL)
              fh.write("```" + NL)

          if found > budget:
              print("::error::mypy xatolari oshdi (%d > %d). Yangi kodga tip "
                    "yozing, budjetni KO'TARMANG." % (found, budget))
              sys.exit(1)
          print("mypy ok - %d errors (budget %d)" % (found, budget))
          PY

      # ---------------------------------------------------------- testlar
      - name: Testlar (pytest + coverage)
        working-directory: backend
        run: >
          python -m pytest
          --junitxml=test-results/junit.xml
          --cov --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov

      - name: Test natijalari va coverage hisoboti (yiqilganda ham)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            backend/test-results/junit.xml
            backend/coverage.xml
            backend/htmlcov/
          if-no-files-found: warn
          retention-days: 14

      - name: Coverage xulosasi
        if: always()
        working-directory: backend
        run: |
          {
            echo "## Coverage"
            echo ""
            echo "Pol: \`backend/.coveragerc\` → \`fail_under\` (hozir **83%**). DoD maqsadi: 85%."
            echo ""
            echo '```'
            python -m coverage report --skip-covered 2>&1 | tail -n 40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # --------------------------------------------------- OpenAPI sxemasi
      # docs/API_CONTRACT.md majburiy shartnoma va drf-spectacular
      # bog'liqlikda turibdi — lekin sxema hech qachon qurilmasdi.
      #
      # `--fail-on-warn` ni bugun yoqib bo'lmaydi (54 ta noyob xato bor).
      # Buning o'rniga ratchet: sxema QURILISHI shart, YAML sifatida
      # o'qilishi shart va noyob xatolar soni budjetdan oshmasligi kerak.
      - name: OpenAPI sxemasi (ratchet)
        working-directory: backend
        run: |
          set -o pipefail
          if ! python manage.py spectacular --file openapi-schema.yml 2> spectacular.log; then
            echo "::error::OpenAPI sxemasi umuman qurilmadi"
            cat spectacular.log
            exit 1
          fi
          python - <<'PY'
          import os, re, sys, pathlib, yaml

          yaml.safe_load(pathlib.Path("openapi-schema.yml").read_text(encoding="utf-8"))
          log = pathlib.Path("spectacular.log").read_text(encoding="utf-8", errors="replace")
          match = re.search(r"Errors:\s+\d+\s+\((\d+)\s+unique\)", log)
          unique = int(match.group(1)) if match else 0
          budget = int(os.environ["SCHEMA_UNIQUE_ERROR_BUDGET"])

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(
                  f"## OpenAPI sxemasi\n\nNoyob xatolar: **{unique}** / budjet {budget}\n\n"
                  "```\n" + "\n".join(log.strip().splitlines()[-5:]) + "\n```\n"
              )

          if unique > budget:
              print(
                  f"::error::OpenAPI sxemasidagi noyob xatolar soni oshdi "
                  f"({unique} > {budget}). Yangi APIView ga `serializer_class` "
                  f"qo'shing yoki `@extend_schema` bering."
              )
              sys.exit(1)
          print(f"schema ok — {unique} unique errors (budget {budget})")
          PY

      - name: Sxemani artefakt sifatida saqlash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: backend/openapi-schema.yml
          if-no-files-found: warn
          retention-days: 14

      # --------------------------------------------------- OpenAPI drift-check
      # Yuqoridagi "OpenAPI sxemasi (ratchet)" qadami boshqa maqsadga xizmat
      # qiladi: u noyob OGOHLANTIRISH/XATO sonini SCHEMA_UNIQUE_ERROR_BUDGET
      # bilan solishtiradi (backlog ratchet, YAML, faqat log artefakti).
      # Bu qadam butunlay boshqa narsani tekshiradi: `api/openapi.json` —
      # commit qilingan, MAZMUNI tekshiriladigan sxema artefakti — joriy
      # kod bilan mos keladimi. Ikkalasi ATAYLAB yonma-yon turadi, biri
      # ikkinchisini almashtirmaydi.
      #
      # Yagona vakolatli generatsiya buyrug'i `scripts/gen-openapi.sh` da —
      # shu skript ishlatiladi, mantiq bu yerda takrorlanmaydi. Farq bo'lsa
      # (yangi endpoint, o'zgargan serializer va h.k.) `api/openapi.json`
      # eskirgan demakdir va uni commit qilish PR ning bir qismi bo'lishi
      # kerak — xuddi `docs/API_CONTRACT.md` kabi.
      - name: OpenAPI drift-check (api/openapi.json)
        env:
          PYTHON: python
        run: |
          set -o pipefail
          bash scripts/gen-openapi.sh
          # `git status --porcelain`, `git diff --quiet` EMAS: agar
          # `api/openapi.json` hali umuman commit qilinmagan bo'lsa (repo
          # uni track qilmaydi), `git diff` uni "yo'q" deb ko'radi va bu
          # qadam noto'g'ri yashil bo'lardi. `git status` esa yangi
          # (untracked) faylni ham, o'zgargan (tracked) faylni ham ko'radi.
          if [ -n "$(git status --porcelain -- api/openapi.json)" ]; then
            echo "::error::api/openapi.json joriy API bilan mos emas (drift topildi yoki hali commit qilinmagan)."
            git --no-pager diff --stat -- api/openapi.json || true
            git status --porcelain -- api/openapi.json
            {
              echo "## OpenAPI drift-check"
              echo ""
              echo "\`api/openapi.json\` eskirgan. Tuzatish:"
              echo ""
              echo '```'
              echo "bash scripts/gen-openapi.sh"
              echo "git add api/openapi.json"
              echo '```'
              echo ""
              echo "va natijani shu PR bilan birga commit qiling."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "api/openapi.json joriy holatga mos — drift yo'q."
          echo "## OpenAPI drift-check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`api/openapi.json\` joriy holatga mos." >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # Backend — dasturchi muhiti (Windows + SQLite)
  # ==========================================================================
  # Alohida job, matritsa emas: GitHub'ning `services:` konteynerlari faqat
  # Linux runner'da ishlaydi, ya'ni bu legga Postgres/Redis berib bo'lmaydi.
  # Bo'sh REDIS_URL Channels'ni xotiradagi qatlamga tushiradi (settings.py).
  backend-sqlite:
    name: Backend (Windows · SQLite · py3.14)
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      DEBUG: "False"
      SECRET_KEY: "ci-dummy-not-a-real-secret-3f8a1c9e4b7d2056-padded-to-fifty-plus"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_URL: "sqlite:///ci.sqlite3"
      REDIS_URL: ""
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      ACCESS_TOKEN_LIFETIME_MINUTES: "60"
      REFRESH_TOKEN_LIFETIME_DAYS: "7"
      INVITATION_TTL_DAYS: "7"
      AUTH_THROTTLE_RATE: "60/min"
      AUTH_BURST_THROTTLE_RATE: "60/min"
      COMMENT_THROTTLE_RATE: "120/min"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.14 o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Bog'liqliklarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Django check
        working-directory: backend
        run: python manage.py check

      - name: Migratsiyalar
        working-directory: backend
        run: python manage.py migrate --noinput

      # Coverage darvozasi bu yerda YO'Q: bitta vakolatli son bo'lishi kerak,
      # u esa Linux/PostgreSQL legida hisoblanadi. Bu leg SQLite'ga xos
      # xatolarni tutish uchun.
      - name: Testlar (pytest)
        working-directory: backend
        run: python -m pytest --junitxml=test-results/junit.xml

      - name: Test natijalari (yiqilganda ham)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results-windows-sqlite
          path: backend/test-results/junit.xml
          if-no-files-found: warn
          retention-days: 14

  # ==========================================================================
  # Frontend
  # ==========================================================================
  frontend:
    name: Frontend (React 19 · Vite · Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # frontend/.env.example bilan sinxron. ADR 0011 dan keyin nom fazosi
    # `VITE_*` — Vite faqat shu prefiksni bundle ichiga kiritadi, `NEXT_PUBLIC_*`
    # esa endi hech qayerda o'qilmaydi (jimgina `undefined` bo'lardi).
    env:
      VITE_API_BASE_URL: "http://localhost:8000/api/v1"
      VITE_WS_BASE_URL: "ws://localhost:8000"
      VITE_API_MODE: "real"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22 o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      # tsc darvozasi build'dan ALOHIDA turadi: `npm run build` ichida ham
      # `tsc -b` bor, lekin xato xabari Vite logining ichida ko'milib ketmasin.
      # `npm run typecheck` → `frontend/package.json` (`tsc --noEmit`) — CI va
      # lokal `.claude/hooks/tsc-check.sh` bitta buyruqni ishlatadi, ikkalasi
      # sinxrondan chiqmasin.
      - name: Type-check (npm run typecheck)
        working-directory: frontend
        run: npm run typecheck

      # ADR 0013: vitest — komponent/hook/unit qatlami; Playwright quyida,
      # haqiqiy stack ustida. Bu qadam E2E'dan oldin va undan ~30x tez yiqiladi,
      # shuning uchun build'dan ham oldinda turadi.
      - name: Testlar (vitest)
        working-directory: frontend
        run: npm test

      - name: Build (vite build)
        working-directory: frontend
        run: npm run build

  # ==========================================================================
  # E2E — Playwright haqiqiy stack ustida
  # ==========================================================================
  e2e:
    name: E2E (Playwright · Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Backend va frontend allaqachon qizil bo'lsa E2E dan yangilik chiqmaydi —
    # faqat 20 daqiqa ko'proq kutiladi.
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clickup
          POSTGRES_PASSWORD: clickup
          POSTGRES_DB: clickup_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clickup -d clickup_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # --- backend ---------------------------------------------------------
      # DEBUG=False ataylab: E2E prod shaklidagi sozlamani tekshiradi.
      # SECURE_SSL_REDIRECT esa o'chirilgan — u teskari proksining vazifasi;
      # yoqilgan holda http://localhost:8000 har so'rovga https ga 301 beradi
      # va hech nima ishlamaydi.
      DEBUG: "False"
      SECURE_SSL_REDIRECT: "False"
      SECURE_HSTS_SECONDS: "0"
      SECRET_KEY: "ci-dummy-not-a-real-secret-3f8a1c9e4b7d2056-padded-to-fifty-plus"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_URL: "postgres://clickup:clickup@localhost:5432/clickup_e2e"
      REDIS_URL: "redis://localhost:6379/0"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      # WS handshake origin'ini `AllowedHostsOriginValidator` ALLOWED_HOSTS dan
      # oladi, SPA esa boshqa portda — shuning uchun ochiq ro'yxatga olinadi.
      WS_ALLOWED_ORIGINS: "http://localhost:3000"
      ACCESS_TOKEN_LIFETIME_MINUTES: "60"
      REFRESH_TOKEN_LIFETIME_DAYS: "7"
      INVITATION_TTL_DAYS: "7"
      # E2E to'plami login cheklovini UXLAB O'TKAZMAYDI (`e2e/fixtures.ts` →
      # `throttleAdvice`). Sessiyalar REST orqali olinadi, ya'ni bir run'da
      # o'nga yaqin `auth/login/` so'rovi ketadi va standart 10/min ni bosib
      # o'tishi mumkin. Throttle mantig'ining O'ZI backend testlarida
      # (apps/accounts) tekshiriladi — E2E'da uni qayta tekshirish shart emas,
      # shuning uchun bu yerda ataylab bo'shatiladi.
      AUTH_THROTTLE_RATE: "1000/min"
      AUTH_BURST_THROTTLE_RATE: "1000/min"
      COMMENT_THROTTLE_RATE: "1000/min"
      REALTIME_TICKET_THROTTLE_RATE: "1000/min"
      # `auth/refresh/` ham cheklangan: `RefreshRateThrottle`, standarti
      # 30/min, manba manzili bo'yicha. To'plam uni KO'P uradi — brauzer har
      # TO'LIQ sahifa yuklanishida bir marta refresh qiladi
      # (`src/app/providers.tsx` → `SessionBootstrap`), ya'ni ~40 chaqiruv va
      # hammasi runner'ning bitta manzilidan. Nom `config/settings.py` dagi
      # `DEFAULT_THROTTLE_RATES["refresh"]` bilan bir xil bo'lishi shart.
      REFRESH_THROTTLE_RATE: "1000/min"
      # Runner oldida hech qanday proksi yo'q — X-Forwarded-For ga ishonmaymiz.
      NUM_PROXIES: "0"
      LOG_LEVEL: "INFO"
      PYTHONUNBUFFERED: "1"
      # --- frontend --------------------------------------------------------
      # VITE_* build vaqtida bundle ichiga yoziladi (ADR 0011) — ya'ni bu
      # qiymatlar `npm run build` qadamida o'qiladi, `vite preview` da emas.
      VITE_API_BASE_URL: "http://localhost:8000/api/v1"
      VITE_WS_BASE_URL: "ws://localhost:8000"
      VITE_API_MODE: "real"
      # --- test ------------------------------------------------------------
      E2E_BASE_URL: "http://localhost:3000"
      E2E_API_BASE_URL: "http://localhost:8000/api/v1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.14 o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Node 22 o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Python bog'liqliklari
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: Playwright brauzer keshi
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Chromium o'rnatish
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Migratsiyalar + demo ma'lumot
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      # Serverlarni Playwright emas, shu workflow ko'taradi — sababi
      # `playwright.config.ts` da yozilgan. Eng muhimi: loglar faylga tushadi
      # va yiqilganda artefakt bo'lib chiqadi (WS testi yiqilganda birinchi
      # qaraladigan narsa aynan Daphne logi).
      - name: Backend (Daphne) ni ko'tarish
        working-directory: backend
        run: |
          nohup daphne -b 0.0.0.0 -p 8000 config.asgi:application \
            > "${GITHUB_WORKSPACE}/daphne.log" 2>&1 &
          echo $! > "${GITHUB_WORKSPACE}/daphne.pid"

      # `vite preview` — `next start` ning o'rnini bosuvchi: qurilgan `dist/`
      # ni tarqatadi va SPA fallback qiladi, ya'ni `/w/<id>/l/<id>` kabi chuqur
      # havolalar to'g'ridan-to'g'ri ochilganda ham 200 qaytadi (E2E aynan
      # shunday kiradi). `--strictPort` — port band bo'lsa jimgina boshqasiga
      # o'tib ketmasin, aks holda testlar bo'sh sahifaga urilardi.
      - name: Frontend (vite preview) ni ko'tarish
        working-directory: frontend
        run: |
          nohup npx vite preview --host 0.0.0.0 --port 3000 --strictPort \
            > "${GITHUB_WORKSPACE}/frontend.log" 2>&1 &
          echo $! > "${GITHUB_WORKSPACE}/frontend.pid"

      - name: Ikkala server sog'lom bo'lishini kutish
        run: |
          wait_for() {
            name="$1"; url="$2"; log="$3"
            for i in $(seq 1 60); do
              if curl -fsS -o /dev/null --max-time 5 "$url"; then
                echo "$name tayyor (~$((i * 2))s)"
                return 0
              fi
              sleep 2
            done
            echo "::error::$name ${url} manzilida ko'tarilmadi"
            echo "----- ${log} -----"
            tail -n 100 "$log" || true
            return 1
          }
          wait_for backend  http://localhost:8000/api/v1/health/ "${GITHUB_WORKSPACE}/daphne.log"
          wait_for frontend http://localhost:3000/login          "${GITHUB_WORKSPACE}/frontend.log"

      - name: Playwright
        working-directory: frontend
        run: npx playwright test

      - name: Serverlarni to'xtatish
        if: always()
        run: |
          for name in daphne next; do
            pidfile="${GITHUB_WORKSPACE}/${name}.pid"
            [ -f "$pidfile" ] && kill "$(cat "$pidfile")" 2>/dev/null || true
          done
          exit 0

      - name: Server loglari (faqat yiqilganda)
        if: failure()
        run: |
          {
            echo "## Server loglari (oxirgi 80 satr)"
            echo ""
            echo "### Daphne"
            echo '```'; tail -n 80 "${GITHUB_WORKSPACE}/daphne.log" 2>/dev/null || echo "(log yo'q)"; echo '```'
            echo "### Next"
            echo '```'; tail -n 80 "${GITHUB_WORKSPACE}/frontend.log" 2>/dev/null || echo "(log yo'q)"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # `trace: retain-on-failure` bo'lgani uchun yashil runda trace deyarli
      # bo'lmaydi — HTML hisobot + trace'lar faqat yiqilganda yuklanadi.
      - name: Playwright hisoboti va trace'lar (yiqilganda)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            daphne.log
            frontend.log
          if-no-files-found: warn
          retention-days: 14

      - name: E2E junit natijalari
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-junit
          path: frontend/playwright-report/junit.xml
          if-no-files-found: warn
          retention-days: 14

  # ==========================================================================
  # Docker — obrazlar hali quriladimi
  # ==========================================================================
  docker:
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend
            target: runtime
          - image: frontend
            context: ./frontend
            target: runner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      # Push yo'q — savol faqat "obraz hali quriladimi?". Ilgari bu umuman
      # tekshirilmasdi, ya'ni ikkala Dockerfile ham main'da sezilmay
      # buzilishi mumkin edi.
      - name: Build (push yo'q)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
