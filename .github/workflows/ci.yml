name: CI

# Asosiy CI: backend (Django + pytest) va frontend (Next.js) mustaqil ishlaydi.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django 5.2 / Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          # CI-only dummy kredensiallar — prod bilan hech qanday aloqasi yo'q.
          POSTGRES_USER: clickup
          POSTGRES_PASSWORD: clickup
          POSTGRES_DB: clickup_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clickup -d clickup_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    # backend/.env.example bilan sinxron. Qiymatlar faqat CI uchun.
    env:
      DEBUG: "False"
      SECRET_KEY: "ci-dummy-not-a-real-secret-3f8a1c9e4b7d2056"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_URL: "postgres://clickup:clickup@localhost:5432/clickup_ci"
      REDIS_URL: "redis://localhost:6379/0"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      ACCESS_TOKEN_LIFETIME_MINUTES: "60"
      REFRESH_TOKEN_LIFETIME_DAYS: "7"
      INVITATION_TTL_DAYS: "7"
      AUTH_THROTTLE_RATE: "60/min"
      COMMENT_THROTTLE_RATE: "120/min"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.14 o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Bog'liqliklarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Django check
        working-directory: backend
        run: python manage.py check

      - name: Migratsiya drift gate (makemigrations --check)
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Migratsiyalar (PostgreSQL 16)
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Testlar (pytest)
        working-directory: backend
        run: python -m pytest -q

      - name: ruff o'rnatish (requirements'da yo'q)
        continue-on-error: true
        run: pip install ruff

      - name: ruff check (non-blocking)
        continue-on-error: true
        run: ruff check backend

      - name: ruff format --check (non-blocking)
        continue-on-error: true
        run: ruff format --check backend

  frontend:
    name: Frontend (Next.js 16 / Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # frontend/.env.example bilan sinxron.
    env:
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000/api/v1"
      NEXT_PUBLIC_WS_BASE_URL: "ws://localhost:8000"
      NEXT_PUBLIC_API_MODE: "real"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22 o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Type-check (tsc --noEmit)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build (next build)
        working-directory: frontend
        run: npm run build
