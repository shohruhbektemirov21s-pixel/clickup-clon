[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py tests.py
testpaths = apps

# --reuse-db is deliberately NOT here. It saves ~2s and costs an afternoon the
# first time someone adds a migration and gets an unexplained OperationalError
# against last week's schema. Opt in per-run when you know the schema is
# unchanged:  python -m pytest --reuse-db
#
# --strict-markers  : a typo'd @pytest.mark.djnago_db is an error, not a silent
#                     no-op that quietly skips the database.
# --strict-config   : an unknown key in this file is an error, not ignored.
# -ra               : one-line reason for every non-passing test at the end.
# --durations       : the slowest tests are the ones that will time out first.
addopts = -q -ra --strict-markers --strict-config --durations=10

asyncio_mode = auto

# --------------------------------------------------------------------------
# Timeouts (pytest-timeout)
# --------------------------------------------------------------------------
# apps/realtime/tests.py awaits `layer.receive()` with no timeout of its own,
# so a broken consumer hangs forever and burns the entire 20-minute CI job for
# a single test. 60s is ~100x the slowest legitimate unit test here.
# The method is left to pytest-timeout: `signal` on Linux CI (per-test failure
# with a traceback), `thread` on Windows where SIGALRM does not exist.
timeout = 60

# --------------------------------------------------------------------------
# Warnings
# --------------------------------------------------------------------------
# Measured 2026-08-10: the suite emits ~750 warnings from exactly FOUR
# third-party sites and ZERO from apps/* or config/*. So:
#
#   * anything our own code triggers is an ERROR. A Django/DRF deprecation
#     lands as a failing test in the release that announces it, not as a
#     broken app two versions later. Cost today: nothing.
#   * the four known third-party sites are ignored by exact message, each
#     with its reason. That takes the summary from 750 lines to ~0, which is
#     the actual win: a NEW warning is now impossible to miss.
#   * everything else keeps the default action - shown in the summary, not
#     fatal.
#
# A blanket `error` was considered and rejected: it cannot be verified from a
# Windows/SQLite dev box, and the first warning that only appears on
# Linux/PostgreSQL would take the whole suite down for a reason unrelated to
# the change that triggered it. Tighten it once CI has a few green runs and
# the Linux warning set is known.
#
# Order matters: later entries win, so the ignores come after the errors.
filterwarnings =
    error:::apps\..*
    error:::config\..*
    # daphne 4.2.3 sets the asyncio event loop policy at import time; both
    # calls are deprecated in 3.14. Upstream's problem, not reachable from here.
    ignore:'asyncio.WindowsSelectorEventLoopPolicy' is deprecated:DeprecationWarning
    ignore:'asyncio.set_event_loop_policy' is deprecated:DeprecationWarning
    # WhiteNoise nags when STATIC_ROOT does not exist. Tests never serve static
    # files, and the Docker image collects at build time.
    ignore:No directory at:UserWarning
    # PyJWT warns that the test SECRET_KEY is shorter than 32 bytes. Test-only:
    # production refuses to boot with a weak key (config/settings.py).
    ignore:The HMAC key is:UserWarning

# --strict-markers means every marker used anywhere must be declared here.
markers =
    slow: takes more than a second; excluded by `-m "not slow"`.
