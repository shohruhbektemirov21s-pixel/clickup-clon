# Ruff — backend lint gate.
#
# `.github/workflows/ci.yml` runs `ruff check backend` as a BLOCKING step.
# The rule set below is therefore scoped to what the tree passes *today*, so a
# red lint always means "this PR broke something", never "the backlog is old".
#
# Growing the set is a deliberate, separate commit: enable one family, fix the
# findings, land it. What is intentionally still off is listed under
# "Deferred" at the bottom — with the reason, not just the code.

target-version = "py314"
line-length = 100

# Generated by Django, reviewed as data rather than as code.
extend-exclude = ["staticfiles", "media", "db.sqlite3"]

[lint]
select = [
    "E",     # pycodestyle errors — the tree already writes `# noqa: E402`
    "W",     # pycodestyle warnings
    "F",     # pyflakes: F821 undefined-name, unused imports/variables
    "T20",   # no stray print() — management commands use self.stdout.write
    "A",     # do not shadow builtins
    "ASYNC", # blocking calls inside async def (Channels consumers)
    "DTZ",   # naive datetime — every due_date/position timestamp is tz-aware
    "G",     # logging call format (no f-strings in logger.*)
    "LOG",   # logging API misuse
    "PLE",   # pylint errors (genuine bugs, not style)
    "PLW",   # pylint warnings that are near-always bugs
    "PIE",   # misc lints (duplicate class fields, unnecessary pass, ...)
    "ISC",   # implicit string concatenation (usually a missing comma)
    "FLY",   # static-join -> f-string
    "EXE",   # shebang/executable-bit mismatches
    "INT",   # gettext misuse
    "ICN",   # import conventions
    "TID",   # banned/relative imports
    "YTT",   # sys.version misuse
]

ignore = [
    # 134 hits. The tree wraps at ~100 by hand but not everywhere; enforcing it
    # now would mean touching 40+ files that eight people are editing. Turn it
    # on together with `ruff format` (see Deferred).
    "E501",
]

# Every entry below is a REAL finding in a file this workflow's author does not
# own. Each one is a one-line fix; delete the entry when the owner lands it.
[lint.per-file-ignores]
# 2026-08-10 — Django `startapp` scaffolding that was never filled in.
# Fix: delete the three stub files (the app has no models/admin/views).
"apps/realtime/admin.py" = ["F401"]
"apps/realtime/models.py" = ["F401"]
"apps/realtime/views.py" = ["F401"]
# 2026-08-10 — `StatusSet` imported but unused. Fix: drop the import.
"apps/workspaces/views.py" = ["F401"]
# 2026-08-10 — `client_for` imported but unused. Fix: drop the import.
"apps/workspaces/test_member_profile.py" = ["F401"]
# 2026-08-10 — `tasks = ...` assigned but never used. Fix: drop the binding
# (or assert on it — it looks like a half-written assertion).
"apps/tasks/tests.py" = ["F841"]
# 2026-08-10 — missing trailing newline. Fix: add one.
"apps/tasks/apps.py" = ["W292"]
# NOT a TODO. DRF calls the custom exception handler from inside its own
# `except` block, so `logger.exception()` there does have an active exception —
# ruff only sees that there is no lexical `except:` in the function.
"config/exceptions.py" = ["LOG004"]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------------------
# Deferred — not "temporarily off", but "off until the commit that fixes them"
# ---------------------------------------------------------------------------
#   I    (isort)      18 files, all auto-fixable. Land with `ruff format`.
#   E501 + formatter  `ruff format` would rewrite 58 of 108 files. Doing that
#                     while eight engineers hold branches guarantees conflicts;
#                     schedule it for a quiet tree, then flip E501 back on.
#                     Adoption is one command: `ruff format backend`.
#   B    (bugbear)    10x B904 (raise ... from exc) + 5x B905 (zip strict=).
#                     Both are behaviour-visible; needs the owners' review.
#   RUF012            126 hits — every DRF `permission_classes = [...]` wants
#                     ClassVar. Cosmetic, enormous diff, zero bug value here.
#   ARG               76 hits — DRF/Django signal signatures legitimately take
#                     arguments they ignore. Needs per-signature dummy naming.
#   SIM, UP, C4, N    ~15 hits total; low value, real diff. Batch them later.
#   DJ                2x DJ001 (`null=True` on a CharField in tasks/models.py).
#                     A model + migration change — the tasks owner's call.
#   S    (bandit)     845 hits, but `security.yml` already runs real bandit
#                     with `-ll`; duplicating it here would only add noise.
#   Q, COM            Formatter's job, not the linter's.
