# mypy — backend uchun tip tekshiruvi darvozasi.
#
# Buyruq (`backend/` dan):
#
#     ../.venv/Scripts/python.exe -m mypy
#
# `files =` sozlangani uchun argument shart emas.
#
# DIQQAT — HOZIRCHA CI DARVOZASI EMAS. `.github/workflows/ci.yml` da mypy
# qadami hali YO'Q (u alohida commit'da qo'shiladi). Ya'ni bu fayl bugun
# lokal buyruqni va o'lchangan budjetni belgilaydi, lekin hech narsani
# MAJBURLAMAYDI: qadam qo'shilmaguncha PR yangi xato kiritsa ham CI yashil
# qoladi. Qadam qo'shilganda u aynan quyidagi buyruqni ishlatishi va xato
# sonini `MYPY_ERROR_BUDGET` bilan solishtirishi kerak (namuna — o'sha
# fayldagi `SCHEMA_UNIQUE_ERROR_BUDGET` ratcheti).
#
# ---------------------------------------------------------------------------
# BOSQICHMA-BOSQICH — nega hamma narsa qat'iy emas
# ---------------------------------------------------------------------------
# 108 faylli, tiplanmagan holda yozilgan kod bazasini bir zumda toza qilish
# imkonsiz, va "hammasini o'chirib qo'yish" ham darvoza emas. Shuning uchun
# repo allaqachon ishlatadigan RATCHET usuli qo'llanadi (qarang
# `.github/workflows/ci.yml` dagi `SCHEMA_UNIQUE_ERROR_BUDGET`):
#
#   * `apps/core/*` — ruxsat katalogi, access qatlami, enum'lar, ya'ni butun
#     ruxsat modelining yuragi — QAT'IY tekshiriladi va 0 xato beradi. Bu
#     yerdagi tip xatosi to'g'ridan-to'g'ri xavfsizlik xatosiga aylanadi.
#   * Qolgan kod LENIENT: tekshiriladi, lekin annotatsiya talab qilinmaydi.
#     Uning xatolari soni budjet bilan cheklanadi va budjet FAQAT PASAYADI.
#
# --------------------------------------------------- O'LCHANGAN BUDJET
# 2026-08-11 da O'LCHANGAN (taxmin emas). Bu konfiguratsiya qo'yilgan paytdagi
# boshlang'ich son 117 edi; `apps/core` qat'iy tozalangandan keyin (va u
# tuzatgan `enums.ROLE_RANK` / `realtime.consumers` tiplari butun daraxtga
# tarqagach) haqiqiy son:
#
#     MYPY_ERROR_BUDGET = 46
#
# Qo'shiladigan CI qadami shu sonni budjet bilan solishtiradi. Ratchet
# FAQAT PASAYADI:
# raqamni ko'tarish darvozani o'chirish bilan barobar. Yangi kod uchun tip
# yozing.
#
# `apps/core` uchun alohida, qat'iy o'lchov — budjetsiz, 0 bo'lishi SHART.
# `--follow-imports=silent` MAJBURIY: usiz mypy `apps/core` import qilgan
# begona modullarning (masalan `apps/tasks/views.py`) xatolarini ham sanaydi
# va darvoza boshqa jamoaning ishiga bog'lanib qoladi.
#
#     python -m mypy --follow-imports=silent apps/core
#
# ---------------------------------------------------------------------------

[mypy]
plugins = mypy_django_plugin.main, mypy_drf_plugin.main
python_version = 3.14
files = apps, config

# Lenient asos: tiplanmagan funksiyalar xato emas, lekin YOZILGAN tiplar
# tekshiriladi. Bu "annotatsiya qo'shsang darrov foyda beradi" degan holat.
check_untyped_defs = True
ignore_missing_imports = True
warn_redundant_casts = True
warn_unused_ignores = True
# `# type: ignore` faqat sababi bilan: kodsiz ignore butun faylni ko'r qiladi.
enable_error_code = ignore-without-code

# Xato satrini o'qish oson bo'lsin va budjetni sanash aniq bo'lsin.
show_error_codes = True
pretty = False
namespace_packages = True
explicit_package_bases = False

# Django avtomatik generatsiya qiladi — qo'lda tuzatiladigan kod emas.
exclude = (?x)(/migrations/|^staticfiles/|^media/)

[mypy.plugins.django-stubs]
django_settings_module = "config.settings"

# ---------------------------------------------------------------------------
# QAT'IY zona — ruxsat modeli
# ---------------------------------------------------------------------------
# `strict = True` per-module bo'limlarda qo'llab-quvvatlanmaydi, shuning uchun
# uning bayroqlari ochiq yozilgan. Yangi bayroq qo'shishdan oldin
# `python -m mypy apps/core` ni 0 xato bilan ushlab turishga ishonch hosil qiling.
[mypy-apps.core.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_untyped_decorators = True
disallow_subclassing_any = True
disallow_any_generics = True
check_untyped_defs = True
no_implicit_reexport = True
warn_return_any = True
warn_unused_ignores = True
strict_equality = True
extra_checks = True

# Testlar qat'iy zonadan tashqarida: ular kodni ISHLATADI, e'lon qilmaydi.
# Har bir `def test_x(env):` ga `-> None` yozish katta diff beradi va bitta
# ham xato tutmaydi — tekshiruv o'zi qoladi, majburiy annotatsiya emas.
[mypy-apps.core.tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
disallow_untyped_decorators = False
disallow_any_generics = False
warn_return_any = False

# `seed_demo`/`purge_demo`/`uzbekify_defaults` — bir martalik operator
# skriptlari, ruxsat modeliga tegmaydi.
[mypy-apps.core.management.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
disallow_any_generics = False
warn_return_any = False
